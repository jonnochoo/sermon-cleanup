name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64 executable
        run: >
          dotnet publish csharp/SermonCleanup.Cli
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ inputs.version }}
          -o publish

      - name: Rename to a stable asset name
        run: mv publish/SermonCleanup.Cli.exe publish/sermon-cleanup.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            publish/sermon-cleanup.exe \
            --title "v${{ inputs.version }}" \
            --generate-notes
