name: C# build and test

on:
  push:
    branches: [main]
    paths:
      - "csharp/**"
      - ".github/workflows/csharp-build.yml"
  pull_request:
    paths:
      - "csharp/**"
      - ".github/workflows/csharp-build.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore csharp/SermonCleanup.sln

      - name: Build
        run: dotnet build csharp/SermonCleanup.sln --no-restore -c Release

      - name: Test
        run: dotnet test csharp/SermonCleanup.sln --no-build -c Release
